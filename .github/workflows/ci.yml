name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest
        env:
          JELLYFIN_URL: ${{ vars.JELLYFIN_URL }}
          JELLYFIN_API_KEY: ${{ secrets.JELLYFIN_API_KEY }}
          BOOKORBIT_URL: ${{ vars.BOOKORBIT_URL }}
          BOOKORBIT_USERNAME: ${{ secrets.BOOKORBIT_USERNAME }}
          BOOKORBIT_PASSWORD: ${{ secrets.BOOKORBIT_PASSWORD }}

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/deimos-api:${{ github.sha }}






















