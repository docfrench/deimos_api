name: CI
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Ruff
        run: pip install ruff
      - name: Run Ruff
        run: ruff check .
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        run: python -m pytest
        env:
          JELLYFIN_URL: '${{ vars.JELLYFIN_URL }}'
          JELLYFIN_API_KEY: '${{ secrets.JELLYFIN_API_KEY }}'
          BOOKORBIT_URL: '${{ vars.BOOKORBIT_URL }}'
          BOOKORBIT_USERNAME: '${{ secrets.BOOKORBIT_USERNAME }}'
          BOOKORBIT_PASSWORD: '${{ secrets.BOOKORBIT_PASSWORD }}'
  build-and-push:
    runs-on: ubuntu-latest
    needs:
      - test
      - linter
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/deimos-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/deimos-api:latest
  deploy:
    runs-on: self-hosted
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-deimos-api
      cancel-in-progress: false
    env:
      IMAGE: 'ghcr.io/${{ github.repository_owner }}/deimos-api:${{ github.sha }}'
    steps:
      - name: Pull latest image
        run: docker pull "$IMAGE"
      - name: Replace container (rolls back on failed health check)
        env:
          API_IP: '${{ vars.API_IP }}'
          JELLYFIN_URL: '${{ vars.JELLYFIN_URL }}'
          JELLYFIN_API_KEY: '${{ secrets.JELLYFIN_API_KEY }}'
          BOOKORBIT_URL: '${{ vars.BOOKORBIT_URL }}'
          BOOKORBIT_USERNAME: '${{ secrets.BOOKORBIT_USERNAME }}'
          BOOKORBIT_PASSWORD: '${{ secrets.BOOKORBIT_PASSWORD }}'
        run: |
          set -euo pipefail


          prev_image=$(docker inspect --format '{{.Config.Image}}' deimos_api
          2>/dev/null || true)


          run_container() {
            docker rm -f deimos_api >/dev/null 2>&1 || true
            docker run -d \
              --name deimos_api \
              --network br0 \
              --ip "$API_IP" \
              --restart unless-stopped \
              -v /mnt/user/appdata/fastapi-deimos:/data \
              -e JELLYFIN_URL -e JELLYFIN_API_KEY \
              -e BOOKORBIT_URL -e BOOKORBIT_USERNAME -e BOOKORBIT_PASSWORD \
              "$1"
          }


          healthy() {
            for _ in $(seq 1 15); do
              if docker exec deimos_api python -c \
                "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)" \
                >/dev/null 2>&1; then
                return 0
              fi
              sleep 2
            done
            return 1
          }


          run_container "$IMAGE"

          if ! healthy; then
            echo "New container failed its health check" >&2
            docker logs --tail 50 deimos_api >&2 || true
            if [ -n "$prev_image" ]; then
              echo "Rolling back to $prev_image" >&2
              run_container "$prev_image"
            fi
            exit 1
          fi
