name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest
        env:
          JELLYFIN_URL: ${{ vars.JELLYFIN_URL }}
          JELLYFIN_API_KEY: ${{ secrets.JELLYFIN_API_KEY }}
          BOOKORBIT_URL: ${{ vars.BOOKORBIT_URL }}
          BOOKORBIT_USERNAME: ${{ secrets.BOOKORBIT_USERNAME }}
          BOOKORBIT_PASSWORD: ${{ secrets.BOOKORBIT_PASSWORD }}

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/deimos-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/deimos-api:latest


  deploy:
    runs-on: self-hosted
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Pull latest image
        run: docker pull ghcr.io/${{ github.repository_owner }}/deimos-api:${{ github.sha }}

      - name: Write .env file
        run: |
          cat <<EOF > /tmp/deimos-deploy.env
          JELLYFIN_URL=${{ vars.JELLYFIN_URL }}
          JELLYFIN_API_KEY=${{ secrets.JELLYFIN_API_KEY }}
          BOOKORBIT_URL=${{ vars.BOOKORBIT_URL }}
          BOOKORBIT_USERNAME=${{ secrets.BOOKORBIT_USERNAME }}
          BOOKORBIT_PASSWORD=${{ secrets.BOOKORBIT_PASSWORD }}
          EOF

      - name: Stop and remove old container
        run: docker rm -f deimos-api || true

      - name: Run new container
        run: |
          docker run -d \
            --name deimos-api \
            --network br0 \
            --ip 192.168.0.2 \
            --env-file /tmp/deimos-deploy.env \
            ghcr.io/${{ github.repository_owner }}/deimos-api:${{ github.sha }} 
            
      
      - name: Remove .env
        if: always()
        run: rm -f /tmp/deimos-deploy.env

















